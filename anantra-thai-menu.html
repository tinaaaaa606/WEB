<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anantra Thai — Full Menu</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f8f5f0;
  --bg-card: #ffffff;
  --ink: #1a1714;
  --ink-mid: #5c554d;
  --ink-light: #8f8680;
  --accent: #b5453a;
  --accent-soft: #f3ddd9;
  --gold: #a38a3e;
  --gold-soft: #f2ecd4;
  --teal: #2a8c6a;
  --teal-soft: #ddf0e8;
  --border: #e6dfd7;
  --shadow-sm: 0 1px 3px rgba(26,23,20,0.06);
  --shadow-md: 0 4px 12px rgba(26,23,20,0.08);
  --radius: 10px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased}

/* ===== HEADER ===== */
.header{text-align:center;padding:3rem 1.5rem 2rem;background:linear-gradient(180deg,#fff 0%,var(--bg) 100%);border-bottom:1px solid var(--border)}
.header h1{font-family:'Cormorant Garamond',serif;font-size:clamp(2.2rem,6vw,3.4rem);font-weight:700;letter-spacing:.01em;color:var(--ink)}
.header .tagline{font-size:.8rem;color:var(--ink-light);letter-spacing:.2em;text-transform:uppercase;margin-top:.2rem;font-weight:500}
.header .stats{display:flex;justify-content:center;gap:1.5rem;margin-top:1rem;font-size:.78rem;color:var(--ink-light)}
.header .stats strong{color:var(--accent);font-size:1.1rem;font-weight:600}
.header .loc{margin-top:.6rem;font-size:.75rem;color:var(--ink-light);font-weight:400}

/* ===== CONTROLS ===== */
.controls{position:sticky;top:0;z-index:100;background:rgba(248,245,240,.93);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--border);padding:.75rem 1.5rem}
.search-bar{max-width:480px;margin:0 auto .5rem;position:relative}
.search-bar input{width:100%;padding:.6rem 1rem .6rem 2.5rem;border:1px solid var(--border);border-radius:8px;font-size:.88rem;font-family:inherit;background:var(--bg-card);color:var(--ink);outline:none;transition:border .2s}
.search-bar input:focus{border-color:var(--accent)}
.search-bar .ico{position:absolute;left:.8rem;top:50%;transform:translateY(-50%);color:var(--ink-light);font-size:.95rem;pointer-events:none}
.search-info{text-align:center;font-size:.72rem;color:var(--ink-light);min-height:1em;margin-bottom:.4rem}
.nav-wrap{position:relative}
.nav-wrap::before,.nav-wrap::after{content:'';position:absolute;top:0;bottom:0;width:2.5rem;pointer-events:none;z-index:1;transition:opacity .2s}
.nav-wrap::after{right:0;background:linear-gradient(to right,transparent,rgba(248,245,240,.95))}
.nav-wrap::before{left:0;background:linear-gradient(to left,transparent,rgba(248,245,240,.95));opacity:0}
.nav-wrap.sc-start::before{opacity:1}
.nav-wrap.sc-end::after{opacity:0}
.pills{display:flex;gap:.35rem;overflow-x:auto;scrollbar-width:none;padding-right:2.5rem;padding-bottom:.2rem}
.pills::-webkit-scrollbar{display:none}
.pill{flex-shrink:0;padding:.3rem .75rem;border-radius:18px;border:1px solid var(--border);background:var(--bg-card);font-size:.68rem;font-weight:500;color:var(--ink-light);cursor:pointer;transition:all .15s;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.pill:hover{border-color:var(--accent);color:var(--accent)}
.pill.on{background:var(--accent);color:#fff;border-color:var(--accent)}

/* ===== LAYOUT TOGGLE ===== */
.view-toggle{display:flex;justify-content:flex-end;max-width:860px;margin:.8rem auto 0;padding:0 1.5rem;gap:.3rem}
.view-btn{padding:.25rem .6rem;border:1px solid var(--border);border-radius:6px;background:var(--bg-card);cursor:pointer;font-size:.72rem;color:var(--ink-light);transition:all .15s}
.view-btn.on{background:var(--ink);color:#fff;border-color:var(--ink)}

/* ===== CONTENT ===== */
.content{max-width:860px;margin:0 auto;padding:1rem 1.5rem 3rem}
.cat{margin-bottom:2.5rem}
.cat-head{display:flex;align-items:center;gap:.7rem;margin-bottom:.8rem;padding-bottom:.4rem;border-bottom:2px solid var(--accent)}
.cat-name{font-family:'Cormorant Garamond',serif;font-size:1.3rem;font-weight:700}
.cat-badge{font-size:.65rem;background:var(--accent-soft);color:var(--accent);padding:.12rem .5rem;border-radius:8px;font-weight:600}
.cat-desc{font-size:.78rem;color:var(--ink-light);margin:-0.4rem 0 .6rem;font-weight:300}

/* ===== CARD VIEW ===== */
.items-grid{display:flex;flex-direction:column;gap:.5rem}
.card{display:flex;gap:.9rem;padding:.7rem;border-radius:var(--radius);background:var(--bg-card);border:1px solid var(--border);transition:box-shadow .15s}
.card:hover{box-shadow:var(--shadow-md)}
.card.inactive{opacity:.4}
.card-img{width:90px;height:90px;border-radius:8px;object-fit:cover;flex-shrink:0;background:var(--border)}
.card-img.empty{display:flex;align-items:center;justify-content:center;font-size:1.8rem;color:var(--border)}
.card-body{flex:1;min-width:0;display:flex;flex-direction:column}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:.5rem}
.card-name{font-weight:600;font-size:.9rem;line-height:1.3}
.card-name .hl{background:var(--gold-soft);padding:0 2px;border-radius:2px}
.card-price{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:1.05rem;color:var(--accent);white-space:nowrap;flex-shrink:0}
.card-desc{font-size:.78rem;color:var(--ink-mid);font-weight:300;line-height:1.45;margin-top:.15rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-desc.expanded{-webkit-line-clamp:unset}
.card-desc-toggle{font-size:.68rem;color:var(--teal);cursor:pointer;font-weight:500;background:none;border:none;font-family:inherit;padding:.1rem 0}

/* ===== COMPACT VIEW ===== */
.items-list .row{display:flex;justify-content:space-between;align-items:flex-start;gap:.8rem;padding:.55rem 0;border-bottom:1px dotted var(--border)}
.items-list .row:last-child{border-bottom:none}
.row-info{flex:1;min-width:0}
.row-name{font-weight:600;font-size:.88rem}
.row-name .hl{background:var(--gold-soft);padding:0 2px;border-radius:2px}
.row-desc{font-size:.76rem;color:var(--ink-light);font-weight:300;margin-top:.1rem}
.row-price{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:1rem;color:var(--accent);white-space:nowrap}

/* ===== MODIFIERS ===== */
.mods{margin-top:.3rem}
.mod-btn{font-size:.7rem;color:var(--teal);cursor:pointer;font-weight:500;background:none;border:none;font-family:inherit;padding:.15rem 0;display:inline-flex;align-items:center;gap:.25rem}
.mod-btn:hover{color:#0f6e56}
.mod-btn .arr{font-size:.55rem;transition:transform .15s;display:inline-block}
.mod-btn .arr.open{transform:rotate(90deg)}
.mod-panel{display:none;margin-top:.25rem;padding-left:.5rem;border-left:2px solid var(--teal-soft)}
.mod-panel.open{display:block}
.mg{margin-bottom:.35rem}
.mg-head{font-size:.72rem;font-weight:600;display:flex;align-items:center;gap:.35rem;margin-bottom:.1rem}
.mg-badge{font-size:.55rem;padding:.05rem .3rem;border-radius:3px;font-weight:600}
.mg-req{background:var(--accent-soft);color:var(--accent)}
.mg-opt{background:#f0ede6;color:var(--ink-light)}
.mg-type{font-size:.55rem;color:var(--ink-light);font-weight:400}
.mg-choices{display:flex;flex-wrap:wrap;gap:.15rem .45rem;font-size:.7rem;color:var(--ink-light)}
.mg-c{display:inline-flex;align-items:center;gap:.15rem}
.mg-c.def{color:var(--teal);font-weight:500}
.mg-c-price{color:var(--accent);font-weight:500;font-size:.66rem}

/* ===== EMPTY STATE ===== */
.empty-state{text-align:center;padding:3rem 1rem;color:var(--ink-light)}
.empty-state .emoji{font-size:2.5rem;margin-bottom:.4rem}

/* ===== IMAGE MODAL ===== */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;align-items:center;justify-content:center;cursor:zoom-out}
.modal-bg.open{display:flex}
.modal-bg img{max-width:90vw;max-height:85vh;border-radius:8px;box-shadow:0 8px 40px rgba(0,0,0,.4)}

@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.cat{animation:fadeUp .35s ease both}

@media(max-width:520px){
  .header{padding:2rem 1rem 1.5rem}
  .content{padding:.8rem 1rem 2rem}
  .card-img{width:70px;height:70px}
  .card{gap:.6rem;padding:.5rem}
}
</style>
</head>
<body>

<div class="header">
  <h1>Anantra Thai</h1>

</div>

<div class="content" id="out"></div>

<div class="modal-bg" id="modal" onclick="this.classList.remove('open')">
  <img id="modalImg" src="" alt="">
</div>

<script>
const qEl=document.getElementById('q'),pillsEl=document.getElementById('pills'),outEl=document.getElementById('out'),infoEl=document.getElementById('info'),navWrap=document.getElementById('navWrap'),modal=document.getElementById('modal'),modalImg=document.getElementById('modalImg');
let activeCat=null,viewMode='card';

document.getElementById('nCat').textContent=MENU.length;
document.getElementById('nItem').textContent=MENU.reduce((s,c)=>s+c.items.length,0);
document.getElementById('nImg').textContent=MENU.reduce((s,c)=>s+c.items.filter(i=>i.image).length,0);

function buildPills(){
  const a=document.createElement('span');a.className='pill on';a.textContent='All';
  a.onclick=()=>{activeCat=null;render()};pillsEl.appendChild(a);
  MENU.forEach((c,i)=>{
    const p=document.createElement('span');p.className='pill';p.textContent=c.name;
    p.onclick=()=>{activeCat=i;render();p.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});document.querySelector(`[data-ci="${i}"]`)?.scrollIntoView({behavior:'smooth',block:'start'})};
    pillsEl.appendChild(p);
  });
}

function hl(t,q){if(!q)return t;return t.replace(new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`,'gi'),'<span class="hl">$1</span>')}
function typeL(t){return t==='TYPE_SINGLE_SELECT'?'pick 1':t==='TYPE_MULTI_SELECT'?'pick many':t==='TYPE_UNIT_STEPPER'?'stepper':t}

function match(item,q){
  if(!q)return true;
  if(item.name.toLowerCase().includes(q)||item.description?.toLowerCase().includes(q))return true;
  for(const m of item.modifiers){if(m.name.toLowerCase().includes(q))return true;for(const c of m.choices)if(c.name.toLowerCase().includes(q))return true}
  return false;
}

function modHTML(mods){
  if(!mods.length)return'';
  const n=mods.reduce((s,m)=>s+m.choices.length,0);
  let h=`<div class="mods"><button class="mod-btn" onclick="toggleMod(this)"><span class="arr">&#9654;</span>${mods.length} modifier${mods.length>1?'s':''} (${n} choices)</button><div class="mod-panel">`;
  mods.forEach(m=>{
    h+=`<div class="mg"><div class="mg-head">${m.name} <span class="mg-badge ${m.required?'mg-req':'mg-opt'}">${m.required?'required':'optional'}</span><span class="mg-type">${typeL(m.type)}${m.max?' · max '+m.max:''}</span></div><div class="mg-choices">`;
    m.choices.forEach(c=>{
      const d=c.default?' mg-c def':'',p=c.price>0?` <span class="mg-c-price">+$${c.price.toFixed(2)}</span>`:'',ck=c.default?'&#10003; ':'';
      h+=`<span class="mg-c${d}">${ck}${c.name}${p}</span>`;
    });
    h+=`</div></div>`;
  });
  return h+'</div></div>';
}

function render(){
  const q=qEl.value.trim().toLowerCase();
  let html='',cnt=0;
  const cats=activeCat!==null?[{c:MENU[activeCat],i:activeCat}]:MENU.map((c,i)=>({c,i}));

  cats.forEach(({c,i})=>{
    const fi=c.items.filter(it=>match(it,q));
    if(!fi.length)return;
    cnt+=fi.length;
    html+=`<div class="cat" data-ci="${i}"><div class="cat-head"><span class="cat-name">${c.name}</span><span class="cat-badge">${fi.length}</span></div>`;
    if(c.description)html+=`<div class="cat-desc">${c.description}</div>`;

    if(viewMode==='card'){
      html+=`<div class="items-grid">`;
      fi.forEach(it=>{
        const cls=it.inactive?' inactive':'';
        const nm=hl(it.name,q),ds=it.description?hl(it.description,q):'';
        const imgTag=it.image?`<img class="card-img" src="${it.image}" alt="${it.name}" loading="lazy" onclick="showImg('${it.image}')">`:`<div class="card-img empty">&#127836;</div>`;
        html+=`<div class="card${cls}">${imgTag}<div class="card-body"><div class="card-top"><div class="card-name">${nm}</div><div class="card-price">$${it.price.toFixed(2)}</div></div>${ds?`<div class="card-desc">${ds}</div>`:''}${modHTML(it.modifiers)}</div></div>`;
      });
      html+=`</div>`;
    } else {
      html+=`<div class="items-list">`;
      fi.forEach(it=>{
        const nm=hl(it.name,q),ds=it.description?hl(it.description,q):'';
        html+=`<div class="row"><div class="row-info"><div class="row-name">${nm}</div>${ds?`<div class="row-desc">${ds}</div>`:''}${modHTML(it.modifiers)}</div><div class="row-price">$${it.price.toFixed(2)}</div></div>`;
      });
      html+=`</div>`;
    }
    html+=`</div>`;
  });

  if(!html)html=`<div class="empty-state"><div class="emoji">&#128373;</div><p>No items match "${qEl.value}"</p></div>`;
  outEl.innerHTML=html;
  infoEl.textContent=q?`${cnt} item${cnt!==1?'s':''} found`:'';

  document.querySelectorAll('.pill').forEach((p,j)=>{
    p.className=j===0?(activeCat===null?'pill on':'pill'):(activeCat===(j-1)?'pill on':'pill');
  });

  if(q){document.querySelectorAll('.mod-btn').forEach(b=>{
    const p=b.nextElementSibling;if(p&&p.textContent.toLowerCase().includes(q)){p.classList.add('open');b.querySelector('.arr').classList.add('open')}
  })}
}

function toggleMod(b){const p=b.nextElementSibling,a=b.querySelector('.arr');p.classList.toggle('open');a.classList.toggle('open')}
function showImg(src){modalImg.src=src;modal.classList.add('open')}
function setView(v){viewMode=v;document.getElementById('vCard').className='view-btn'+(v==='card'?' on':'');document.getElementById('vList').className='view-btn'+(v==='list'?' on':'');render()}

qEl.addEventListener('input',()=>{activeCat=null;render()});
pillsEl.addEventListener('scroll',()=>{
  navWrap.classList.toggle('sc-start',pillsEl.scrollLeft>10);
  navWrap.classList.toggle('sc-end',pillsEl.scrollLeft+pillsEl.clientWidth>=pillsEl.scrollWidth-10);
});

buildPills();render();
</script>
</body>
</html>
